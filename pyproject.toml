[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pdf-metadata-editor"
version = "1.0.0"
description = "A clean Windows desktop app for editing PDF metadata"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "pikepdf>=8.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyinstaller>=6.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
